<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500">
  <defs>
    <linearGradient id="cyber-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0d182b"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="neon-stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#192843" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f192b" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16253d" stroke-width="0.75" opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#00f0ff" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="820" height="500" fill="url(#cyber-bg)"/>
  <rect width="820" height="500" fill="url(#grid)"/>

  <!-- Blueprint Perspective Rays -->
  <path d="M -40 340 L 420 55 L 860 340" fill="none" stroke="#1d3152" stroke-width="1.2" stroke-dasharray="4 6"/>
  <path d="M -40 375 L 420 90 L 860 375" fill="none" stroke="#182945" stroke-width="1" stroke-dasharray="6 8"/>
  <path d="M -40 410 L 420 125 L 860 410" fill="none" stroke="#142138" stroke-width="0.8"/>

  <!-- Header Section -->
  <g transform="translate(40, 48)">
    <circle cx="0" cy="-4" r="3" fill="#00f0ff" filter="url(#laser-glow)"/>
    <text x="14" y="0" fill="#00f0ff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="3">R_HMT / UTILITIES</text>
    <text x="730" y="0" fill="#58749a" font-family="'Space Grotesk', monospace" font-size="9" text-anchor="end" letter-spacing="1.5">SYS.FLOW_06 // PIPELINE</text>
    <line x1="0" y1="14" x2="730" y2="14" stroke="#1f3454" stroke-width="1"/>
  </g>

  <!-- Flow Lines / Laser Circuit Tracks -->
  <g filter="url(#laser-glow)">
    <!-- Main Laser Trunk -->
    <path d="M 210 240 L 320 240 L 320 155 L 450 155" fill="none" stroke="url(#neon-stream)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 320 240 L 320 325 L 450 325" fill="none" stroke="url(#neon-stream)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 520 155 L 610 155 L 610 240 L 530 240" fill="none" stroke="url(#neon-stream)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 520 325 L 610 325 L 610 240" fill="none" stroke="url(#neon-stream)" stroke-width="3" stroke-linecap="round"/>
    <!-- Extension to Exit Node -->
    <path d="M 610 240 L 650 240" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Laser Circuit Glow Dots -->
  <circle cx="320" cy="240" r="4" fill="#00f0ff" filter="url(#laser-glow)"/>
  <circle cx="610" cy="240" r="4" fill="#00f0ff" filter="url(#laser-glow)"/>

  <!-- Architecture Flow Nodes (Glass Modules) -->
  <!-- Node 1: Ingestion / Source -->
  <g transform="translate(145, 205)">
    <rect width="70" height="70" rx="14" fill="url(#card-glass)" stroke="#00f0ff" stroke-width="1.8" filter="url(#laser-glow)"/>
    <circle cx="35" cy="35" r="14" fill="#00f0ff" fill-opacity="0.12"/>
    <path d="M 27 35 L 43 35 M 35 27 L 43 35 L 35 43" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="35" y="86" fill="#88a8d0" font-family="'Space Grotesk', sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">SOURCE</text>
  </g>

  <!-- Node 2: Transform / Build Top -->
  <g transform="translate(440, 120)">
    <rect width="70" height="70" rx="14" fill="url(#card-glass)" stroke="#3b82f6" stroke-width="1.8" filter="url(#laser-glow)"/>
    <circle cx="35" cy="35" r="14" fill="#3b82f6" fill-opacity="0.12"/>
    <rect x="27" y="27" width="16" height="16" rx="4" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <text x="35" y="86" fill="#88a8d0" font-family="'Space Grotesk', sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">PROCESS</text>
  </g>

  <!-- Node 3: Synthesize / Agent Bottom -->
  <g transform="translate(440, 290)">
    <rect width="70" height="70" rx="14" fill="url(#card-glass)" stroke="#8b5cf6" stroke-width="1.8" filter="url(#laser-glow)"/>
    <circle cx="35" cy="35" r="14" fill="#8b5cf6" fill-opacity="0.12"/>
    <path d="M 28 35 L 35 28 L 42 35 L 35 42 Z" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="35" y="86" fill="#88a8d0" font-family="'Space Grotesk', sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">AGENT_AI</text>
  </g>

  <!-- Node 4: Deploy / Runtime Output -->
  <g transform="translate(640, 205)">
    <rect width="70" height="70" rx="14" fill="url(#card-glass)" stroke="#00f0ff" stroke-width="1.8" filter="url(#laser-glow)"/>
    <circle cx="35" cy="35" r="14" fill="#00f0ff" fill-opacity="0.12"/>
    <path d="M 30 35 L 34 39 L 41 31" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="35" y="86" fill="#88a8d0" font-family="'Space Grotesk', sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">DEPLOY</text>
  </g>

  <!-- Footer Info / Legend -->
  <g transform="translate(40, 440)">
    <text x="0" y="0" fill="#f0f6fc" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">Repo Flow</text>
    <text x="0" y="22" fill="#58749a" font-family="'Space Grotesk', monospace" font-size="10" letter-spacing="2">ILLUSTRATIVE ARCHITECTURE // AGENTIC STACK</text>
    
    <g transform="translate(730, 10)">
      <circle cx="-110" cy="-6" r="3" fill="#10b981" filter="url(#laser-glow)"/>
      <text x="-100" y="-3" fill="#10b981" font-family="'Space Grotesk', monospace" font-size="9" font-weight="600" letter-spacing="1.5">LIVE PIPELINE VERIFIED</text>
    </g>
  </g>
</svg>
